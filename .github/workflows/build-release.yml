name: Build Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后创建 GitHub Release'
        required: false
        type: boolean
        default: true
      tag:
        description: 'Release 标签（留空则自动使用 pubspec 版本号，如 v1.3.0）'
        required: false
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'
  APP_NAME: m328v6

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Read version from pubspec
        id: ver
        shell: bash
        run: echo "ver=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath dist/${{ env.APP_NAME }}-${{ steps.ver.outputs.ver }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Read version from pubspec
        id: ver
        run: echo "ver=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/${{ env.APP_NAME }}-${{ steps.ver.outputs.ver }}-linux-x64.tar.gz \
            -C build/linux/x64/runner bundle

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  build-android:
    name: Android (universal APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Read version from pubspec
        id: ver
        run: echo "ver=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Package
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/${{ env.APP_NAME }}-${{ steps.ver.outputs.ver }}-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-android]
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="v$VER"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          gh release create "${{ steps.tag.outputs.tag }}" dist/* \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes
